# OmniWM config modelled on .config/sway/config. Option plays the role of sway's $mod
# (Command would clash with macOS app shortcuts). Schema is strict: see
# https://omniwm.app/config/settings-reference/ before adding or removing keys.
schemaVersion = 5

[general]
animationsEnabled = true
defaultLayoutType = "dwindle"
hotkeysEnabled = true
hyperKeyModifiers = "Control+Option+Shift+Command"
ipcEnabled = true
preventSleepEnabled = false
systemHyperTrigger = "None"
updateChecksEnabled = true
workspaceAutoBackAndForth = true

[focus]
crossesMonitorAtEdge = false
followsMouse = false
followsWindowToMonitor = false
lockModifier = "off"
moveCrossesMonitorAtEdge = false
moveMouseToFocusedWindow = false
raiseOnMouseFocus = false

[mouseWarp]
constrainToArrangement = false
enabled = true
margin = 1

[routing]
arrangements = []
mode = "macOS"

[gaps]
fullscreenUsesOuterGaps = false
size = 20.0

[gaps.outer]
bottom = 0.0
left = 0.0
right = 0.0
top = 0.0

[niri]
alwaysCenterSingleColumn = false
centerFocusedColumn = "never"
infiniteLoop = false
singleWindowFit = "fill"
visibleContainerCount = 2

[dwindle]
defaultSplitRatio = 1.0
moveToRootStable = true
singleWindowFit = "fill"
smartSplit = false
splitWidthMultiplier = 1.0
useGlobalGaps = true

# everforest blue, same as sway client.focused
[borders]
enabled = true
width = 2.0

[borders.color]
alpha = 1.0
blue = 0.702
green = 0.733
red = 0.498

[overview]
zoom = 1.0

[overview.backdrop]
alpha = 0.0
blue = 0.08
green = 0.05
red = 0.05

[overview.windowBorders.hovered]
alpha = 1.0
blue = 1.0
green = 0.6
red = 0.4

[overview.windowBorders.normal]
alpha = 0.5
blue = 0.35
green = 0.3
red = 0.3

[overview.windowBorders.selected]
alpha = 1.0
blue = 0.4
green = 0.8
red = 0.3

[workspaceBar]
backgroundOpacity = 0.1
deduplicateAppIcons = false
enabled = true
excludedBundleIDs = []
height = 24.0
hideEmptyWorkspaces = false
hideInNativeFullscreen = false
notchActiveZoneWidth = 180.0
notchMode = "moveBelowMenuBar"
position = "overlappingMenuBar"
reserveLayoutSpace = false
revealHoldMilliseconds = 200.0
revealModifier = "off"
showFloatingWindows = false
showLabels = true
systemStatsButton = false
windowLevel = "popup"
xOffset = 0.0
yOffset = 0.0

[workspaceBar.iconOverrides]

[gestures]
fingerCount = 3
invertDirection = true
# mouse*ModifierKey: required by v0.8.0, dropped on main (kept as unknown keys there)
mouseMoveModifierKey = "option"
mouseResizeModifierKey = "option"
scrollEnabled = true
scrollModifierKey = "optionShift"
scrollSensitivity = 5.0
trackpadScrollStyle = "snap"
workspaceSwipeAxis = "vertical"
workspaceSwipeEnabled = false
workspaceSwipeFingerCount = 3

[statusBar]
showAppNames = false
showWorkspaceName = false
useWorkspaceId = false

[hiddenBar]
enabled = true
hiddenBundleIDs = []
rehideIntervalSeconds = 5.0

[launcher]
shell = "zsh"
terminal = "ghostty"

[clipboard]
historyEnabled = false
maxItemBytes = 8388608
maxItems = 200
maxTotalBytes = 67108864

[quakeTerminal]
animationDuration = 0.2
autoHide = false
backgroundEffect = "standardBlur"
enabled = true
heightPercent = 50.0
position = "center"
widthPercent = 50.0

[scratchpads.labels]

[appearance]
# mode: required by v0.8.0, dropped on main
mode = "automatic"
tabRailAppIcons = false

