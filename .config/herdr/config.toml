onboarding = false

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "prefix+shift+n"
type = "popup"
command = 'cd "$HOME" || exit; dir="$(fd . ~/hashi ~/Projects ~/projects ~/Documents --exclude .git --type directory | fzf --prompt="Workspace path: ")"; [ -n "$dir" ] && "$HERDR_BIN_PATH" workspace create --cwd "$dir"'
description = "new workspace from directory"
width = "80%"
height = "80%"
